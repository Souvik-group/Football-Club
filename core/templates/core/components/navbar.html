{% load static %}
<nav class="navbar">
<div class="nav-container">

<div class="logo">
<img src="{% static 'images/logo.webp' %}" alt="AGNI Sangha Football Club Logo" width="50" height="50">
<span>AGNI Sangha</span>
</div>

<input type="checkbox" id="menu-toggle" class="menu-toggle">

<div class="hamburger" onclick="toggleMenu()">
<span></span>
<span></span>
<span></span>
</div>

<ul class="nav-menu" id="navMenu">

<li><a href="{% url 'home' %}">Home</a></li>
<li><a href="{% url 'about_page' %}">About</a></li>
<li><a href="{% url 'team_page' %}">Team</a></li>

<li class="dropdown">
    <a href="#" class="dropdown-toggle">News ▾</a>
    <ul class="dropdown-menu">
        <li><a href="{% url 'news_page' %}">📰 Latest News</a></li>
        <li><a href="{% url 'events_page' %}">📅 Upcoming Events</a></li>
    </ul>
</li>
<li><a href="{% url 'home' %}#contact">Contact</a></li>
<li><a href="{% url 'admin_login' %}" class="login-btn">Admin</a></li>
</ul>

</div>
</nav>
<script>
// Smooth scroll behavior for anchor links
document.querySelectorAll('a[href^="#"]').forEach(link => {
    link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href !== '#' && document.querySelector(href)) {
            e.preventDefault();
            const target = document.querySelector(href);
            const menuToggle = document.getElementById('menu-toggle');
            const hamburger = document.querySelector('.hamburger');
            const navMenu = document.getElementById('navMenu');
            
            // Close mobile menu if open
            if (menuToggle.checked) {
                menuToggle.checked = false;
                hamburger.classList.remove('open');
                navMenu.classList.remove('open');
            }
            
            // Smooth scroll to target
            window.scrollTo({
                top: target.offsetTop - 80,
                behavior: 'smooth'
            });
        }
    });
});

function toggleMenu(){
    const menu = document.getElementById("navMenu");
    const burger = document.querySelector(".hamburger");
    menu.classList.toggle("open");
    burger.classList.toggle("open");
}

document.querySelectorAll('.dropdown-toggle').forEach(function(toggle) {
    toggle.addEventListener('click', function(e) {
        e.preventDefault();
        this.closest('.dropdown').classList.toggle('open');
    });
});

document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown')) {
        document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
    }
});
</script>
