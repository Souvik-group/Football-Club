{% load static %}
<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="{% static 'images/logo.png' %}" alt="AGNI Logo" class="footer-logo">
                <h3>Arjungeria AGNI Sangha</h3>
                <p>Igniting Passion, Inspiring Excellence.</p>
            </div>
            
            <div class="footer-links">
                <h4>Quick Links</h4>
                <ul>
                    <li><a href="{% url 'home' %}">Home</a></li>
                    <li><a href="{% url 'about_page' %}">About Us</a></li>
                    <li><a href="{% url 'team_page' %}">Meet the Team</a></li>
                </ul>
            </div>
            
            <div class="footer-social">
                <h4>Follow Us</h4>
                <div class="social-icons">
                    <a href="https://www.facebook.com/profile.php?id=100089924785026&sk" title="Facebook">FB</a>
                </div>
            </div>
        </div>
        
        <div class="footer-bottom">
            <p>&copy; 2026 Arjungeria AGNI Sangha. All Rights Reserved.</p>
            <p class="developer-credit">Designed & Developed by <span class="dev-name">Souvik</span></p>
        </div>
    </div>
</footer>

<style>
    .site-footer {
        background: #030d08;
        color: #dbe5d8;
        padding: 80px 20px 25px;
        border-top: 1px solid rgba(135, 245, 153, 0.1);
        position: relative;
        font-family: 'Inter', 'Montserrat', sans-serif;
    }

    /* Top glowing line */
    .site-footer::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(58, 222, 107, 0.4), transparent);
        box-shadow: 0 0 20px rgba(58, 222, 107, 0.6);
    }

    .footer-container {
        max-width: 1200px;
        margin: auto;
    }

    .footer-content {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        gap: 50px;
        margin-bottom: 60px;
    }

    .footer-brand h3 {
        color: #fff;
        font-size: 26px;
        margin-bottom: 12px;
        font-weight: 800;
        background: linear-gradient(135deg, #e4ffe8, #50d268);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.5px;
    }

    .footer-brand p {
        color: #a8b5a0;
        font-size: 15px;
        line-height: 1.6;
        max-width: 300px;
    }

    .footer-logo {
        height: 70px;
        margin-bottom: 25px;
        filter: drop-shadow(0 0 15px rgba(80, 183, 79, 0.4));
    }

    .footer-links h4, .footer-social h4 {
        color: #fff;
        margin-bottom: 25px;
        font-size: 18px;
        font-weight: 700;
        position: relative;
        display: inline-block;
    }
    
    .footer-links h4::after, .footer-social h4::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 0;
        width: 40px;
        height: 2px;
        background: #50d268;
    }

    .footer-links ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .footer-links li {
        margin-bottom: 15px;
    }

    .footer-links a {
        color: #a8b5a0;
        text-decoration: none;
        transition: all 0.3s ease;
        font-size: 15px;
        display: inline-block;
    }

    .footer-links a:hover {
        color: #50d268;
        transform: translateX(4px);
    }

    .social-icons {
        display: flex;
        gap: 15px;
    }

    .social-icons a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 45px;
        height: 45px;
        background: rgba(80, 183, 79, 0.08);
        color: #50d268;
        border-radius: 50%;
        text-decoration: none;
        border: 1px solid rgba(80, 183, 79, 0.2);
        transition: all 0.35s ease;
        font-weight: bold;
        font-size: 14px;
    }

    .social-icons a:hover {
        background: #50d268;
        color: #030d08;
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(80, 183, 79, 0.3);
    }

    .footer-bottom {
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        padding-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        font-size: 14px;
        gap: 15px;
        color: #6d7b65;
    }

    .developer-credit {
        font-weight: 500;
        background: rgba(255, 255, 255, 0.02);
        padding: 10px 20px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(5px);
    }

    .dev-name {
        color: #8ce678;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-shadow: 0 0 10px rgba(111, 236, 134, 0.3);
    }

    @media (max-width: 900px) {
        .footer-content {
            grid-template-columns: 1fr 1fr;
        }
    }

    @media (max-width: 768px) {
        .footer-content {
            grid-template-columns: 1fr;
            text-align: center;
            gap: 40px;
        }

        .footer-brand p {
            margin: 0 auto;
        }

        .footer-links h4::after, .footer-social h4::after {
            left: 50%;
            transform: translateX(-50%);
        }

        .footer-links a:hover {
            transform: none;
        }

        .social-icons {
            justify-content: center;
        }

        .footer-bottom {
            flex-direction: column;
            text-align: center;
        }
    }
</style>
