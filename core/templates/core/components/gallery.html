{% load static %}
<section class="py-20 bg-classic-midgreen">
     <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center pt-8">
        <div class="flex items-center justify-center mb-10">
            <div class="h-px bg-white/20 w-24 mx-4"></div>
            <i class="fa-solid fa-camera text-classic-gold text-xl mx-2"></i>
            <h2 class="text-3xl font-sans font-bold text-white tracking-widest uppercase">Photo Gallery</h2>
            <div class="h-px bg-white/20 w-24 mx-4"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mb-10">
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?auto=format&fit=crop&q=80&w=600" alt="Gallery 1" class="w-full h-full object-cover gallery-img">
            </div>
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1587280501635-68a0e82cd5ff?auto=format&fit=crop&q=80&w=600" alt="Gallery 2" class="w-full h-full object-cover gallery-img">
            </div>
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1512218168353-4e4b11f7eccc?auto=format&fit=crop&q=80&w=600" alt="Gallery 3" class="w-full h-full object-cover gallery-img">
            </div>
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1518605368461-1ee7c68cd46a?auto=format&fit=crop&q=80&w=600" alt="Gallery 4" class="w-full h-full object-cover gallery-img aspect-[4/3]">
            </div>
             <!-- Adding a few more for the standalone gallery page -->
             <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1577223625816-7546f13df25d?auto=format&fit=crop&q=80&w=600" alt="Gallery 5" class="w-full h-full object-cover gallery-img">
            </div>
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1508344928928-7165b67de128?auto=format&fit=crop&q=80&w=600" alt="Gallery 6" class="w-full h-full object-cover gallery-img">
            </div>
             <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors">
                <img src="https://images.unsplash.com/photo-1522778526582-120021665e7d?auto=format&fit=crop&q=80&w=600" alt="Gallery 7" class="w-full h-full object-cover gallery-img">
            </div>
            <div class="aspect-square gallery-img-wrapper border-2 border-transparent hover:border-classic-gold transition-colors flex items-center justify-center bg-classic-darkgreen border-classic-gold border-dashed">
                <span class="text-white font-sans font-bold tracking-widest text-sm uppercase">More Coming Soon</span>
            </div>
        </div>
    </div>
</section>
