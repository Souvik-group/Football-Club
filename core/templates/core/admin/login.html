{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a2e1f, #174c37);
    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 45px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.login-box img {
    width: 60px;
    display: block;
    margin: 0 auto 10px;
}

.login-box h2 {
    text-align: center;
    color: #f0c15b;
    font-size: 22px;
    margin-bottom: 6px;
}

.login-box p {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    margin-bottom: 6px;
}

.form-group input {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: white;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
}

.form-group input:focus {
    border-color: #f0c15b;
    background: rgba(255,255,255,0.12);
}

.error-msg {
    background: rgba(220,50,50,0.2);
    border: 1px solid rgba(220,50,50,0.4);
    color: #ff8080;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
}

.login-submit {
    width: 100%;
    padding: 12px;
    background: #f0c15b;
    color: #0a2e1f;
    font-weight: 700;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: 0.3s;
}

.login-submit:hover {
    background: #e0b040;
    box-shadow: 0 4px 15px rgba(240,193,91,0.4);
}
</style>
</head>
<body>

<div class="login-box">
    <img src="{% static 'images/logo.png' %}" alt="logo">
    <h2>Admin Login</h2>
    <p>Arjungeria AGNI Sangha</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="login-submit">Login</button>
    </form>
</div>

</body>
</html>
