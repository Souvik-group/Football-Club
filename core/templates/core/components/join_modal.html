<!-- Join Club Modal -->
<div id="joinModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); backdrop-filter:blur(6px); z-index:99999; justify-content:center; align-items:center;">
    <div style="background:#0a2e1f; border:1px solid rgba(80,210,104,0.25); border-radius:20px; padding:40px 36px; width:90%; max-width:460px; position:relative;">
        
        <button onclick="closeJoinModal()" style="position:absolute; top:16px; right:20px; background:none; border:none; color:#a8b5a0; font-size:26px; cursor:pointer; line-height:1;">&times;</button>
        
        <h2 style="color:#50d268; font-size:22px; font-weight:800; margin-bottom:6px;">⚽ Join Our Club</h2>
        <p style="color:#6d7b65; font-size:13px; margin-bottom:28px;">Fill in your details to become a member of Arjungeria AGNI Sangha.</p>

        <form method="POST" action="{% url 'join_club' %}">
            {% csrf_token %}

            <div style="margin-bottom:16px;">
                <input type="text" name="name" placeholder="Full Name" required maxlength="150" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:white; font-size:14px; outline:none; box-sizing:border-box;"
                    onfocus="this.style.borderColor='#50d268'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">
            </div>

            <div style="margin-bottom:16px;">
                <input type="number" name="age" placeholder="Age" required min="5" max="60" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:white; font-size:14px; outline:none; box-sizing:border-box;"
                    onfocus="this.style.borderColor='#50d268'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">
            </div>

            <div style="margin-bottom:16px;">
                <input type="tel" name="phone" placeholder="Mobile Number" required maxlength="15" style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:white; font-size:14px; outline:none; box-sizing:border-box;"
                    onfocus="this.style.borderColor='#50d268'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">
            </div>

            <div style="margin-bottom:24px;">
                <input type="email" name="email" placeholder="Email Address" required style="width:100%; padding:12px 16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:10px; color:white; font-size:14px; outline:none; box-sizing:border-box;"
                    onfocus="this.style.borderColor='#50d268'" onblur="this.style.borderColor='rgba(255,255,255,0.12)'">
            </div>

            <button type="submit" style="width:100%; padding:14px; background:linear-gradient(135deg,#50d268,#2ea84a); border:none; border-radius:10px; color:#030d08; font-size:15px; font-weight:800; cursor:pointer; transition:0.3s;"
                onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
                🚀 Join Now
            </button>
        </form>
    </div>
</div>

<script>
function openJoinModal() {
    document.getElementById('joinModal').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}
function closeJoinModal() {
    document.getElementById('joinModal').style.display = 'none';
    document.body.style.overflow = '';
}
document.getElementById('joinModal').addEventListener('click', function(e) {
    if (e.target === this) closeJoinModal();
});
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeJoinModal();
});
</script>
